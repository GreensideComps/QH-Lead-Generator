<title>Fleet Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#eef1ef;
  --surface:#ffffff;
  --surface-2:#e5e9e5;
  --surface-3:#dde2dd;
  --ink:#1a1d1b;
  --ink-secondary:#52564f;
  --ink-muted:#82877e;
  --border:#d5dad2;
  --border-strong:#c2c8bd;
  --accent:#c07a24;
  --accent-strong:#9c5f13;
  --accent-soft:#f2e2c7;
  --accent-ink:#5a3a0c;
  --good:#2e7d4f;
  --good-soft:#dbeee1;
  --good-ink:#1f5536;
  --warn:#a17a0c;
  --warn-soft:#f1e6c4;
  --warn-ink:#725509;
  --critical:#b23a2e;
  --critical-soft:#f5dad5;
  --critical-ink:#7e2a21;
  --info:#345f89;
  --info-soft:#dde6ee;
  --info-ink:#25445f;
  --shadow-1:0 1px 2px rgba(20,20,15,.06), 0 1px 1px rgba(20,20,15,.04);
  --shadow-2:0 6px 20px rgba(20,20,15,.10), 0 2px 6px rgba(20,20,15,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#14171a;
    --surface:#1c2024;
    --surface-2:#20242a;
    --surface-3:#282d33;
    --ink:#edeee9;
    --ink-secondary:#b7bbb2;
    --ink-muted:#80857c;
    --border:#333941;
    --border-strong:#454c55;
    --accent:#e0983f;
    --accent-strong:#f0ac57;
    --accent-soft:#3a2c16;
    --accent-ink:#f2c98a;
    --good:#4fae79;
    --good-soft:#173222;
    --good-ink:#8fd6ac;
    --warn:#d1ab3d;
    --warn-soft:#332a10;
    --warn-ink:#e7c96b;
    --critical:#e2695a;
    --critical-soft:#3a1d18;
    --critical-ink:#f2a297;
    --info:#6fa0c9;
    --info-soft:#182534;
    --info-ink:#a8c8e3;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 8px 24px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ground:#14171a;
  --surface:#1c2024;
  --surface-2:#20242a;
  --surface-3:#282d33;
  --ink:#edeee9;
  --ink-secondary:#b7bbb2;
  --ink-muted:#80857c;
  --border:#333941;
  --border-strong:#454c55;
  --accent:#e0983f;
  --accent-strong:#f0ac57;
  --accent-soft:#3a2c16;
  --accent-ink:#f2c98a;
  --good:#4fae79;
  --good-soft:#173222;
  --good-ink:#8fd6ac;
  --warn:#d1ab3d;
  --warn-soft:#332a10;
  --warn-ink:#e7c96b;
  --critical:#e2695a;
  --critical-soft:#3a1d18;
  --critical-ink:#f2a297;
  --info:#6fa0c9;
  --info-soft:#182534;
  --info-ink:#a8c8e3;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 8px 24px rgba(0,0,0,.45);
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'Public Sans',system-ui,sans-serif;
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Archivo',system-ui,sans-serif;font-weight:800;letter-spacing:-0.01em;margin:0;text-wrap:balance;}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;}
a{color:inherit;}
button{font-family:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh;}
.nav{
  width:236px;flex-shrink:0;background:var(--surface-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:1.15rem .9rem;position:sticky;top:0;height:100vh;overflow-y:auto;gap:1.4rem;
}
.brand{display:flex;align-items:center;gap:.6rem;padding:.2rem .35rem .4rem;}
.brand__mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;flex-shrink:0;}
.brand__mark svg{width:17px;height:17px;}
.brand__name{font-family:'Archivo';font-weight:800;font-size:1.02rem;letter-spacing:-.01em;}
.brand__sub{font-size:.68rem;color:var(--ink-muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase;}
.navlist{display:flex;flex-direction:column;gap:.15rem;}
.navlink{
  display:flex;align-items:center;gap:.65rem;padding:.55rem .65rem;border-radius:8px;
  color:var(--ink-secondary);font-weight:600;font-size:.88rem;cursor:pointer;border:1px solid transparent;
  background:transparent;text-align:left;width:100%;
}
.navlink svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.navlink:hover{background:var(--surface-3);color:var(--ink);}
.navlink.active{background:var(--surface);color:var(--ink);border-color:var(--border);box-shadow:var(--shadow-1);}
.navlink.active svg{opacity:1;color:var(--accent);}
.navlink .count{margin-left:auto;font-family:'IBM Plex Mono';font-size:.72rem;font-weight:600;color:var(--ink-muted);background:var(--surface-3);padding:.05rem .4rem;border-radius:999px;}
.navlink.active .count{background:var(--accent-soft);color:var(--accent-ink);}
.nav__spacer{flex:1;}
.nav__context{
  border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:.75rem .8rem;font-size:.78rem;color:var(--ink-secondary);
}
.nav__context b{display:block;color:var(--ink);font-family:'Archivo';font-weight:700;font-size:.85rem;margin-bottom:.15rem;}
.nav__context .row{display:flex;justify-content:space-between;margin-top:.3rem;color:var(--ink-muted);}
.nav__context .row span:last-child{color:var(--ink-secondary);font-weight:600;font-family:'IBM Plex Mono';}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  padding:1rem 2rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;
  gap:1rem;background:var(--surface);position:sticky;top:0;z-index:5;flex-wrap:wrap;
}
.topbar__title{display:flex;flex-direction:column;gap:.1rem;}
.topbar__title h1{font-size:1.28rem;}
.topbar__meta{font-size:.78rem;color:var(--ink-muted);}
.topbar__actions{display:flex;align-items:center;gap:.6rem;}
.proto-badge{
  display:inline-flex;align-items:center;gap:.4rem;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--warn-ink);background:var(--warn-soft);border:1px solid var(--warn);border-radius:999px;padding:.28rem .6rem;
}
.proto-badge svg{width:12px;height:12px;}
.content{padding:1.75rem 2rem 3rem;display:flex;flex-direction:column;gap:1.75rem;max-width:1180px;width:100%;margin:0 auto;}
@media (max-width:900px){
  .app{flex-direction:column;}
  .nav{position:static;width:100%;height:auto;flex-direction:row;align-items:center;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);}
  .brand{padding:0 .5rem 0 0;}
  .navlist{flex-direction:row;}
  .nav__spacer{display:none;}
  .nav__context{display:none;}
  .content{padding:1.25rem 1rem 2.5rem;}
  .topbar{padding:.85rem 1rem;}
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:.45rem;font-weight:700;font-size:.83rem;padding:.5rem .9rem;border-radius:8px;
  border:1px solid transparent;cursor:pointer;background:var(--accent);color:#fff;transition:background .12s ease;
}
.btn svg{width:14px;height:14px;}
.btn:hover{background:var(--accent-strong);}
.btn--ghost{background:transparent;border-color:var(--border-strong);color:var(--ink);}
.btn--ghost:hover{background:var(--surface-3);}
.btn--sm{padding:.35rem .65rem;font-size:.76rem;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- section heading ---------- */
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.section-head h2{font-size:1.02rem;}
.section-head .hint{font-size:.78rem;color:var(--ink-muted);}

/* ---------- stat tiles ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem;}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:.3rem;}
.tile__label{font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted);}
.tile__value{font-family:'IBM Plex Mono';font-weight:600;font-size:1.55rem;color:var(--ink);}
.tile__sub{font-size:.76rem;color:var(--ink-secondary);}
.tile--accent .tile__value{color:var(--accent-strong);}

/* ---------- alert strip ---------- */
.alert{
  display:flex;align-items:flex-start;gap:.65rem;background:var(--warn-soft);border:1px solid var(--warn);color:var(--warn-ink);
  border-radius:10px;padding:.7rem .9rem;font-size:.83rem;
}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:.1rem;}
.alert b{font-weight:700;}

/* ---------- badges / provenance ---------- */
.badge{
  display:inline-flex;align-items:center;gap:.32em;font-weight:700;font-size:.66rem;letter-spacing:.03em;text-transform:uppercase;
  padding:.22em .55em;border-radius:999px;border:1px solid transparent;white-space:nowrap;
}
.badge svg{width:10px;height:10px;}
.badge--verified{background:var(--info-soft);color:var(--info-ink);border-color:var(--info);}
.badge--calculated{background:var(--surface-3);color:var(--ink-secondary);border-color:var(--border-strong);}
.badge--customer{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent);}
.badge--estimated{background:var(--warn-soft);color:var(--warn-ink);border-color:var(--warn);}
.badge--unknown{background:transparent;color:var(--ink-muted);border-color:var(--border-strong);border-style:dashed;}
.pill{display:inline-flex;align-items:center;gap:.35em;font-weight:700;font-size:.72rem;padding:.25em .6em;border-radius:999px;}
.pill--good{background:var(--good-soft);color:var(--good-ink);}
.pill--warn{background:var(--warn-soft);color:var(--warn-ink);}
.pill--critical{background:var(--critical-soft);color:var(--critical-ink);}
.pill--muted{background:var(--surface-3);color:var(--ink-secondary);}
.pill--accent{background:var(--accent-soft);color:var(--accent-ink);}

/* ---------- score ring ---------- */
.ring{position:relative;width:56px;height:56px;border-radius:50%;flex-shrink:0;background:conic-gradient(var(--ring-c) calc(var(--p)*3.6deg), var(--border) 0deg);}
.ring::after{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--surface);}
.ring__num{position:absolute;inset:0;display:grid;place-items:center;font-family:'IBM Plex Mono';font-weight:600;font-size:.95rem;color:var(--ink);z-index:1;}
.ring--lg{width:88px;height:88px;}
.ring--lg::after{inset:9px;}
.ring--lg .ring__num{font-size:1.4rem;}

/* ---------- opportunity cards ---------- */
.filters{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;}
.seg button{
  background:var(--surface);border:none;padding:.4rem .75rem;font-size:.78rem;font-weight:600;color:var(--ink-secondary);cursor:pointer;
  border-right:1px solid var(--border-strong);
}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--accent);color:#fff;}

.card-list{display:flex;flex-direction:column;gap:.7rem;}
.opp-card{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;box-shadow:var(--shadow-1);
  display:grid;grid-template-columns:56px 1fr auto;gap:1rem;align-items:flex-start;cursor:pointer;transition:box-shadow .12s ease, border-color .12s ease;
}
.opp-card:hover{box-shadow:var(--shadow-2);border-color:var(--border-strong);}
.opp-card__main{display:flex;flex-direction:column;gap:.4rem;min-width:0;}
.opp-card__top{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;}
.opp-card__title{font-family:'Archivo';font-weight:700;font-size:.98rem;}
.opp-card__meta{display:flex;flex-wrap:wrap;gap:.15rem .9rem;font-size:.78rem;color:var(--ink-muted);}
.opp-card__meta b{color:var(--ink-secondary);font-weight:600;}
.opp-card__reqs{font-size:.83rem;color:var(--ink-secondary);}
.opp-card__badges{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.1rem;}
.opp-card__side{display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;text-align:right;}
.opp-card__value{font-family:'IBM Plex Mono';font-weight:600;font-size:.95rem;}
.opp-card__action{font-size:.74rem;color:var(--ink-muted);max-width:180px;}
@media (max-width:640px){
  .opp-card{grid-template-columns:44px 1fr;}
  .opp-card__side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center;text-align:left;}
  .ring{width:44px;height:44px;}
  .ring::after{inset:5px;}
}

.empty{
  border:1px dashed var(--border-strong);border-radius:12px;padding:2.2rem 1.5rem;text-align:center;color:var(--ink-muted);
  display:flex;flex-direction:column;gap:.4rem;align-items:center;background:var(--surface);
}
.empty svg{width:26px;height:26px;opacity:.6;margin-bottom:.2rem;}
.empty b{color:var(--ink-secondary);}

/* ---------- skeleton ---------- */
.skeleton{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.1rem;display:grid;grid-template-columns:56px 1fr auto;gap:1rem;}
.skel-block{background:linear-gradient(90deg,var(--surface-3) 25%,var(--border) 37%,var(--surface-3) 63%);background-size:400% 100%;border-radius:6px;animation:shimmer 1.4s ease infinite;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
@media (prefers-reduced-motion:reduce){.skel-block{animation:none;}}

/* ---------- detail page ---------- */
.detail-grid{display:grid;grid-template-columns:1fr 320px;gap:1.5rem;align-items:start;}
@media (max-width:960px){.detail-grid{grid-template-columns:1fr;}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem 1.35rem;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:.9rem;}
.panel h3{font-size:.92rem;display:flex;align-items:center;gap:.5rem;}
.panel h3 svg{width:16px;height:16px;color:var(--accent);}
.stack{display:flex;flex-direction:column;gap:1.25rem;}
.fact{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.86rem;}
.fact:last-child{border-bottom:none;}
.fact__label{color:var(--ink-secondary);}
.fact__value{font-family:'IBM Plex Mono';font-weight:600;text-align:right;}
.fact__src{display:block;font-family:'Public Sans';font-weight:400;font-size:.72rem;color:var(--ink-muted);margin-top:.15rem;}

.bar-row{display:grid;grid-template-columns:118px 1fr 34px;gap:.7rem;align-items:center;font-size:.8rem;}
.bar-row + .bar-row{margin-top:.5rem;}
.bar-track{height:8px;border-radius:4px;background:var(--border);overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);}
.bar-val{font-family:'IBM Plex Mono';text-align:right;color:var(--ink-secondary);}

.evi-table{width:100%;border-collapse:collapse;font-size:.82rem;}
.evi-table th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-muted);font-weight:700;padding:.4rem .6rem;border-bottom:1px solid var(--border-strong);}
.evi-table td{padding:.55rem .6rem;border-bottom:1px solid var(--border);vertical-align:top;}
.evi-table tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;}
.evi-src{font-size:.74rem;color:var(--info);text-decoration:none;}
.evi-src:hover{text-decoration:underline;}

.action-box{display:flex;flex-direction:column;gap:.7rem;}
.status-row{display:flex;flex-wrap:wrap;gap:.4rem;}
.status-btn{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-secondary);border-radius:999px;
  padding:.35rem .7rem;font-size:.76rem;font-weight:600;cursor:pointer;
}
.status-btn.active{background:var(--ink);color:var(--surface);border-color:var(--ink);}
.status-btn[data-status="won"].active{background:var(--good);border-color:var(--good);}
.status-btn[data-status="lost"].active{background:var(--critical);border-color:var(--critical);}
.status-btn[data-status="not_relevant"].active{background:var(--ink-muted);border-color:var(--ink-muted);}
.feedback-box{border-top:1px solid var(--border);padding-top:.75rem;display:flex;flex-direction:column;gap:.5rem;}
.feedback-row{display:flex;gap:.5rem;}
.fb-btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:.35rem .6rem;cursor:pointer;display:flex;gap:.35rem;align-items:center;font-size:.78rem;font-weight:600;color:var(--ink-secondary);}
.fb-btn svg{width:14px;height:14px;}
.fb-btn.selected{border-color:var(--accent);color:var(--accent-strong);background:var(--accent-soft);}
textarea{width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:.55rem .65rem;font-family:inherit;font-size:.82rem;resize:vertical;min-height:56px;background:var(--surface);color:var(--ink);}

/* ---------- pipeline ---------- */
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:.85rem;overflow-x:auto;padding-bottom:.5rem;}
@media (max-width:1100px){.pipeline{grid-auto-flow:column;grid-template-columns:none;}}
.pcol{display:flex;flex-direction:column;gap:.6rem;min-width:180px;}
.pcol__head{display:flex;align-items:center;justify-content:space-between;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-muted);padding:0 .1rem;}
.pcol__head .count{font-family:'IBM Plex Mono';background:var(--surface-3);border-radius:999px;padding:.05rem .45rem;}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.7rem .8rem;box-shadow:var(--shadow-1);cursor:pointer;display:flex;flex-direction:column;gap:.4rem;}
.pcard:hover{border-color:var(--border-strong);}
.pcard__title{font-size:.82rem;font-weight:700;font-family:'Archivo';line-height:1.3;}
.pcard__meta{font-size:.71rem;color:var(--ink-muted);display:flex;justify-content:space-between;}
.pcol-empty{border:1px dashed var(--border-strong);border-radius:10px;padding:1rem .6rem;text-align:center;color:var(--ink-muted);font-size:.74rem;}

/* ---------- profile form ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
@media (max-width:760px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:.35rem;}
.field label{font-size:.76rem;font-weight:700;color:var(--ink-secondary);}
.field .hint{font-size:.71rem;color:var(--ink-muted);font-weight:400;}
input[type=text],input[type=number]{
  border:1px solid var(--border-strong);border-radius:8px;padding:.5rem .65rem;font-family:'IBM Plex Mono';font-size:.85rem;
  background:var(--surface);color:var(--ink);width:100%;
}
input:focus{border-color:var(--accent);}
.chip-input{display:flex;flex-wrap:wrap;gap:.4rem;}
.chip{
  display:inline-flex;align-items:center;gap:.4rem;background:var(--surface-3);border:1px solid var(--border-strong);border-radius:999px;
  padding:.3rem .5rem .3rem .75rem;font-size:.78rem;font-weight:600;cursor:pointer;user-select:none;
}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);}
.fleet-row{display:grid;grid-template-columns:1fr 90px auto;gap:.5rem;align-items:center;}
.fleet-total{font-size:.78rem;color:var(--ink-muted);}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:1.4rem;right:1.4rem;background:var(--ink);color:var(--ground);padding:.7rem 1rem;border-radius:10px;
  font-size:.83rem;font-weight:600;box-shadow:var(--shadow-2);display:flex;align-items:center;gap:.5rem;z-index:50;
  transform:translateY(12px);opacity:0;transition:all .18s ease;pointer-events:none;
}
.toast.show{transform:translateY(0);opacity:1;}
.toast svg{width:15px;height:15px;color:var(--accent-strong);}

/* ---------- sources page ---------- */
.src-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1rem 1.2rem;box-shadow:var(--shadow-1);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:center;}
.src-name{font-family:'Archivo';font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:.5rem;}
.src-meta{font-size:.78rem;color:var(--ink-muted);margin-top:.25rem;}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.75rem;}
.legend-item{display:flex;gap:.6rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem .85rem;}
.legend-item b{display:block;font-family:'Archivo';font-size:.86rem;margin-bottom:.15rem;}
.legend-item p{margin:0;font-size:.78rem;color:var(--ink-secondary);}
</style>

<div class="app">
  <nav class="nav" id="nav"></nav>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <main class="content" id="view"></main>

function loadState(){

  }catch(e){}
  return null;
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({profile: state.profile, statuses: state.statuses, feedback: state.feedback})); }catch(e){}
}

function fmtGBP(n){ if(n==null) return '—'; return '£' + Math.round(n).toLocaleString('en-GB'); }
function scoreBand(s){ if(s>=85) return {c:'good', label:'High fit', ring:'var(--accent)'}; if(s>=55) return {c:'warn', label:'Medium fit', ring:'var(--warn)'}; return {c:'muted', label:'Low fit', ring:'var(--ink-muted)'}; }
function badge(label){
  const map = {
    verified:{cls:'verified', ic:'check', text:'Verified'},
    calculated:{cls:'calculated', ic:'calc', text:'Calculated'},
    customer:{cls:'customer', ic:'person', text:'Your data'},
    estimated:{cls:'estimated', ic:'wave', text:'Estimated'},
    inferred:{cls:'estimated', ic:'wave', text:'Inferred'},
    unknown:{cls:'unknown', ic:'dash', text:'Unknown'},
  };
  const m = map[label] || map.unknown;
  return `<span class="badge badge--${m.cls}">${icon(m.ic)}${m.text}</span>`;
}
function statusPill(s){
  const map = {
    new:{cls:'accent', text:'New'}, interested:{cls:'accent', text:'Interested'}, contacted:{cls:'warn', text:'Contacted'},
    won:{cls:'good', text:'Won'}, lost:{cls:'critical', text:'Lost'}, not_relevant:{cls:'muted', text:'Not relevant'},
  };
  const m = map[s] || map.new;
  return `<span class="pill pill--${m.cls}">${m.text}</span>`;
}
function ring(score, big){
  const b = scoreBand(score);
  return `<div class="ring${big?' ring--lg':''}" style="--p:${score};--ring-c:${b.ring}"><span class="ring__num mono">${score}</span></div>`;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = icon('check') + '<span>'+msg+'</span>';
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ============ render dispatch ============ */
function render(){
  renderNav();
  renderTopbar();
  const view = document.getElementById('view');
  if(state.view==='dashboard') view.innerHTML = viewDashboard();
  else if(state.view==='opportunities') view.innerHTML = viewOpportunities();
  else if(state.view==='detail') view.innerHTML = viewDetail();
  else if(state.view==='pipeline') view.innerHTML = viewPipeline();
  else if(state.view==='profile') view.innerHTML = viewProfile();
  else if(state.view==='sources') view.innerHTML = viewSources();
  bindView();
}

function bindView(){
  document.querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', ()=> openOpp(el.dataset.open)));
  const back = document.querySelector('[data-back]');
  if(back) back.addEventListener('click', ()=>{ state.view='opportunities'; render(); });

  document.querySelectorAll('[data-filter]').forEach(el=> el.addEventListener('click', ()=>{ state.feedFilter = el.dataset.filter; render(); }));

  document.querySelectorAll('[data-status]').forEach(el=> el.addEventListener('click', ()=>{
    state.statuses[state.selected.id] = el.dataset.status;
    saveState();
    toast('Marked as ' + el.dataset.status.replace('_',' '));
    render();
    openOpp(state.selected.id);
  }));

  document.querySelectorAll('[data-fb]').forEach(el=> el.addEventListener('click', ()=>{
    document.querySelectorAll('[data-fb]').forEach(b=>b.classList.remove('selected'));
    el.classList.add('selected');
    el.dataset.pending = 'true';
    el.__pendingCorrect = el.dataset.fb === 'true';
    window.__pendingFb = el.dataset.fb === 'true';
  }));
  const fbSave = document.querySelector('[data-fb-save]');
  if(fbSave) fbSave.addEventListener('click', ()=>{
    const selectedBtn = document.querySelector('[data-fb].selected');
    const correct = selectedBtn ? selectedBtn.dataset.fb === 'true' : (state.feedback[state.selected.id]?.correct ?? true);
    const note = document.getElementById('fb-note').value;
    state.feedback[state.selected.id] = {correct, note};
    saveState();
    toast('Feedback saved');
  });

  // profile page
  const nameEl = document.getElementById('f-name');
  if(nameEl){
    document.querySelectorAll('[data-chip]').forEach(el=> el.addEventListener('click', ()=>{
      const kind = el.dataset.chip, val = el.dataset.val;
      const arr = kind==='service' ? state.profile.services : state.profile.sectors;
      const idx = arr.indexOf(val);
      if(idx>-1) arr.splice(idx,1); else arr.push(val);
      render();
    }));
    document.querySelectorAll('[data-fleet-remove]').forEach(el=> el.addEventListener('click', ()=>{
      state.profile.fleet.splice(Number(el.dataset.fleetRemove),1); render();
    }));
    const fleetAdd = document.getElementById('fleet-add');
    if(fleetAdd) fleetAdd.addEventListener('click', ()=>{ state.profile.fleet.push({type:'New vehicle type', count:0}); render(); });

    const save = document.getElementById('profile-save');
    save.addEventListener('click', ()=>{
      const p = state.profile;
      p.name = nameEl.value; p.base = document.getElementById('f-base').value;
      p.radius = Number(document.getElementById('f-radius').value)||0;
      p.capacityAvailable = Number(document.getElementById('f-capacity').value)||0;
      p.minValue = Number(document.getElementById('f-minvalue').value)||0;
      p.rates.payload = Number(document.getElementById('f-payload').value)||0;
      p.rates.pricePerTonne = Number(document.getElementById('f-pricetonne').value)||0;
      p.rates.pricePerMile = Number(document.getElementById('f-pricemile').value)||0;
      p.rates.fuelPerMile = Number(document.getElementById('f-fuel').value)||0;
      p.rates.driverPerDay = Number(document.getElementById('f-driver').value)||0;
      p.rates.minMargin = Number(document.getElementById('f-margin').value)||0;
      document.querySelectorAll('[data-fleet-type]').forEach(el=> p.fleet[Number(el.dataset.fleetType)].type = el.value);
      document.querySelectorAll('[data-fleet-count]').forEach(el=> p.fleet[Number(el.dataset.fleetCount)].count = Number(el.value)||0);
      saveState();
      toast('Business profile saved');
      render();
    });
  }
}

render();
setTimeout(()=>{ state.feedLoaded = true; if(state.view==='opportunities' || state.view==='dashboard') render(); }, 420);
</script>
